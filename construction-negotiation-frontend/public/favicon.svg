<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#cnGrad)" />
  
  <!-- Outer Ring Accent -->
  <rect x="8" y="8" width="84" height="84" rx="21" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- CN Monogram Brand Mark -->
  <text x="50" y="64" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="-1.5"
        filter="url(#glow)">CN</text>

  <!-- Construction Crane Structural Line -->
  <path d="M 22 22 L 78 22 L 68 32 L 32 32 Z" fill="rgba(255,255,255,0.15)" />
</svg>